<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Piano Sheets</title>
<style>
  :root{
    --canvas:#000000; --card:#121212; --elev:#1f1f1f; --hover:#292929;
    --iron:#333333; --steel:#535353; --fog:#73777c; --mist:#b3b3b3;
    --bone:#c5c5c5; --green:#1ed760; --white:#ffffff;
    --grad:linear-gradient(90deg,#af2896,#509bf5);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--canvas); color:var(--white);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.33; min-height:100vh;
  }
  /* ---------- top bar ---------- */
  header{
    position:sticky; top:0; z-index:20; background:var(--canvas);
    padding:10px 16px 8px; display:flex; flex-direction:column; gap:10px;
  }
  .brandrow{display:flex; align-items:center; gap:10px;}
  .logo{
    width:34px; height:34px; border-radius:500px; background:var(--green);
    color:#000; display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:700; flex:0 0 auto;
  }
  h1{font-size:24px; font-weight:700; line-height:1.2; margin:0;}
  .brandsub{color:var(--mist); font-size:12px; margin-left:auto; text-align:right;}
  /* piano switch: segmented pill */
  .seg{
    display:flex; background:var(--elev); border-radius:9999px; padding:3px; gap:3px;
  }
  .seg button{
    flex:1; border:0; background:transparent; color:var(--mist); cursor:pointer;
    font:inherit; font-weight:700; font-size:13px; padding:8px 10px; border-radius:9999px;
  }
  .seg button.active{background:var(--white); color:#000;}
  .seg.small button{font-size:12px; padding:6px 8px;}
  .search{
    display:flex; align-items:center; gap:8px; background:var(--elev);
    border-radius:500px; padding:9px 14px;
  }
  .search span{color:var(--bone); font-size:14px;}
  .search input{
    flex:1; background:transparent; border:0; outline:0; color:var(--white);
    font:inherit; font-size:14px; min-width:0;
  }
  .search input::placeholder{color:var(--bone);}
  /* ---------- sections & cards ---------- */
  main{padding:6px 16px 48px; max-width:1100px; margin:0 auto;}
  section{margin-top:26px;}
  .sechead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
  .sechead h2{font-size:24px; font-weight:700; line-height:1.2; margin:0;}
  .sechead .count{color:var(--mist); font-size:12px;}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media (min-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media (min-width:960px){ .grid{grid-template-columns:repeat(4,1fr);} }
  .card{
    background:var(--card); border-radius:6px; padding:12px; cursor:pointer;
    border:0; text-align:left; color:var(--white); font:inherit; width:100%;
  }
  .card:hover,.card:active{background:var(--hover);}
  .tile{
    position:relative; border-radius:6px; aspect-ratio:1/1; margin-bottom:10px;
    background:var(--elev); display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .tile.movie{background:var(--grad);}
  .tile .glyph{font-size:52px; font-weight:700; line-height:1; color:var(--white);}
  .tile .glyph.dim{color:var(--steel);}
  .playbtn{
    position:absolute; right:8px; bottom:8px; width:38px; height:38px;
    border-radius:500px; background:var(--green); color:#000; border:0;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    box-shadow:rgba(0,0,0,.5) 0 8px 24px 0;
  }
  .cardtitle{font-size:14px; font-weight:600; line-height:1.25; margin:0 0 2px;}
  .cardsub{color:var(--mist); font-size:12px; margin:0;}
  .empty{color:var(--mist); padding:24px 0; text-align:center;}
  /* ---------- focus view ---------- */
  #focus{
    position:fixed; inset:0; z-index:40; background:var(--canvas);
    overflow-y:auto; display:none; padding:0 16px 40px;
  }
  #focus.open{display:block;}
  .fbar{
    position:sticky; top:0; background:var(--canvas); z-index:5;
    display:flex; align-items:center; gap:10px; padding:10px 0 8px;
  }
  .roundbtn{
    width:36px; height:36px; border-radius:9999px; border:0; cursor:pointer;
    background:var(--elev); color:var(--white); font-size:17px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .fbar .ftitle{font-size:16px; font-weight:700; flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fbar .seg{flex:0 0 auto;}
  .fgroup{color:var(--green); font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:.08em; margin:8px 0 2px;}
  #focus h2{font-size:24px; font-weight:700; margin:0 0 6px; line-height:1.2;}
  .startbox{
    background:var(--card); border-radius:6px; padding:12px; color:var(--bone);
    font-size:13px; line-height:1.5; margin:12px 0 4px; white-space:pre-line;
  }
  /* keyboard strip */
  .kbwrap{margin:14px 0 4px;}
  .kb{position:relative; display:flex; height:74px; user-select:none;}
  .wkey{
    flex:1; background:var(--white); border:1px solid var(--iron);
    border-radius:0 0 4px 4px; position:relative;
  }
  .wkey.start{background:var(--green);}
  .wkey .lab{
    position:absolute; bottom:4px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:700; color:#000;
  }
  .wkey.start .lab{color:#000;}
  .bkey{
    position:absolute; top:0; height:44px; background:#000;
    border:1px solid var(--iron); border-radius:0 0 3px 3px; z-index:2;
    transform:translateX(-50%);
  }
  .kbcaption{display:flex; justify-content:space-between; color:var(--fog);
    font-size:11px; margin-top:5px;}
  .kbcaption .midc{color:var(--green); font-weight:700;}
  /* notes */
  .notes{margin-top:16px;}
  .nline{margin:0 0 18px;}
  .nrow{line-height:1.35;}
  .tok{
    display:inline-block; font-weight:700; color:var(--white);
    font-size:clamp(24px,6.4vw,44px); margin:0 .18em 0 0; letter-spacing:.01em;
  }
  .tok.sep{color:var(--steel); font-weight:400;}
  .tok.cur{background:var(--green); color:#000; border-radius:6px; padding:0 .12em;}
  .tok.done{color:var(--fog);}
  .lyric{color:var(--mist); font-size:13px; margin-top:2px; min-height:16px;}
  .tip{
    background:var(--card); border-radius:6px; padding:12px; color:var(--mist);
    font-size:13px; line-height:1.5; margin-top:6px; white-space:pre-line;
  }
  /* focus controls */
  .fcontrols{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px;}
  .pill{
    border-radius:9999px; border:0; cursor:pointer; font:inherit; font-weight:700;
    font-size:14px; padding:10px 18px; background:var(--white); color:#000;
  }
  .pill.green{background:var(--green);}
  .ghost{
    border-radius:9999px; border:0; cursor:pointer; font:inherit; font-weight:700;
    font-size:14px; padding:10px 16px; background:transparent; color:var(--mist);
  }
  .ghost:active,.ghost:hover{color:var(--white);}
  .navrow{display:flex; justify-content:space-between; margin-top:28px;
    border-top:1px solid var(--iron); padding-top:14px;}
  .progress{color:var(--fog); font-size:12px; align-self:center;}
</style>
</head>
<body>
<header>
  <div class="brandrow">
    <div class="logo">&#9834;</div>
    <h1>Piano Sheets</h1>
    <div class="brandsub">One finger tunes<br>for the piano</div>
  </div>
  <div class="seg" id="pianoSeg" role="tablist" aria-label="Choose your piano">
    <button data-piano="gig" class="active">Gigglescape</button>
    <button data-piano="casio">Casio CT-X700</button>
  </div>
  <label class="search"><span>&#128269;</span>
    <input id="searchInput" type="search" placeholder="Search tunes" autocomplete="off">
  </label>
</header>
<main id="home"></main>

<div id="focus" aria-live="polite">
  <div class="fbar">
    <button class="roundbtn" id="backBtn" aria-label="Back to all tunes">&#8592;</button>
    <div class="ftitle" id="fTitle"></div>
    <div class="seg small" id="pianoSegFocus">
      <button data-piano="gig">Gigglescape</button>
      <button data-piano="casio">Casio</button>
    </div>
  </div>
  <div class="fgroup" id="fGroup"></div>
  <h2 id="fName"></h2>
  <div class="startbox" id="fStart"></div>
  <div class="kbwrap">
    <div class="kb" id="fKb"></div>
    <div class="kbcaption"><span id="kbLeft"></span><span class="midc" id="kbMid"></span><span id="kbRight"></span></div>
  </div>
  <div class="notes" id="fNotes"></div>
  <div class="tip" id="fTip"></div>
  <div class="fcontrols">
    <button class="pill green" id="followBtn">Follow along</button>
    <button class="pill" id="nextNoteBtn" style="display:none">Next note</button>
    <button class="ghost" id="resetBtn" style="display:none">Start over</button>
    <button class="ghost" id="wakeBtn">Keep screen on</button>
  </div>
  <div class="navrow">
    <button class="ghost" id="prevTune">&#8592; Prev tune</button>
    <div class="progress" id="fProgress"></div>
    <button class="ghost" id="nextTune">Next tune &#8594;</button>
  </div>
</div>

{ id:"farmer", title:"The Farmer in the Dell", group:"Toddler rhymes - Set 2", glyph:"F",
  tip:"Same notes for every verse: the wife, the child, the nurse, the dog, the cat, the mouse, the cheese.",
  gig:{ startKey:7, start:"The first note is G-, the G just left of the middle C. The rest sits around the middle C.",

  casio:{ startKey:5, start:"The first note is G3, the G just below middle C (C4). The rest sits around C4.",
    lines:[["G3 C4 C4 C4 C4 C4","The far-mer in the dell"],["D4 E4 E4 E4 E4 E4","The far-mer in the dell"],["G4 G4 A4 G4 F4 C4","Heigh-ho the der-ry-o"],["C4 E4 E4 D4 D4 C4","The far-mer in the dell"]] } },
{ id:"rainrain", title:"Rain, Rain, Go Away", group:"Toddler rhymes - Set 2", glyph:"R",
  tip:"",
  gig:{ startKey:12, start:"Start on the middle C, the 8th white key. The first note is the G above it, the 12th white key.",
    lines:[["G E G G E","Rain, rain, go a-way"],["G G E A G G E","Come a-gain a-no-ther day"],["F F D D F F D","Lit-tle ones want to play"],["G F E D E C C","Rain, rain, go a-way"]] },
  casio:{ startKey:12, start:"Start around middle C (C4). The first note is G4, above it.",
    lines:[["G4 E4 G4 G4 E4","Rain, rain, go a-way"],["G4 G4 E4 A4 G4 G4 E4","Come a-gain a-no-ther day"],["F4 F4 D4 D4 F4 F4 D4","Lit-tle ones want to play"],["G4 F4 E4 D4 E4 C4 C4","Rain, rain, go a-way"]] } },
{ id:"hickory", title:"Hickory Dickory Dock", group:"Toddler rhymes - Set 2", glyph:"H",
  tip:"",
  gig:{ startKey:10, start:"Start on the middle C, the 8th white key. The first note is E, the 10th white key.",
    lines:[["E F G F E D E","Hick-o-ry dick-o-ry dock"],["E G F D E E","The mouse ran up the clock"],["E E E G G F F A","The clock struck one, the mouse ran down"],["G A G F E D C","Hick-o-ry dick-o-ry dock"]] },
  casio:{ startKey:10, start:"Start around middle C (C4). The first note is E4.",
    lines:[["E4 F4 G4 F4 E4 D4 E4","Hick-o-ry dick-o-ry dock"],["E4 G4 F4 D4 E4 E4","The mouse ran up the clock"],["E4 E4 E4 G4 G4 F4 F4 A4","The clock struck one, the mouse ran down"],["G4 A4 G4 F4 E4 D4 C4","Hick-o-ry dick-o-ry dock"]] } }
];
/* ============ STATE ============ */
const PIANO_NAMES = { gig:"Gigglescape toy piano", casio:"Casio CT-X700" };
let piano = localStorage.getItem("pianoSheetsPiano") || "gig";
if(!PIANO_NAMES[piano]) piano = "gig";
let currentId = null, follow = false, noteIdx = -1, wakeLock = null;

const $ = s => document.querySelector(s);
const homeEl = $("#home"), focusEl = $("#focus");

function variant(t){ return t[piano]; }
function firstNoteLabel(t){
  const v = variant(t);
  const toks = v.lines[0][0].split(/\s+/).filter(x=>x && x!=="|" && x!=="-");
  return "Starts on " + (toks[0]||"");
}
function syncSegs(){
  document.querySelectorAll("#pianoSeg button, #pianoSegFocus button").forEach(b=>{
    b.classList.toggle("active", b.dataset.piano===piano);
  });
}
function setPiano(p){
  piano = p; localStorage.setItem("pianoSheetsPiano", p);
  syncSegs(); renderHome($("#searchInput").value||"");
  if(currentId) renderFocus(false);
}
document.querySelectorAll("#pianoSeg button, #pianoSegFocus button").forEach(b=>{
  b.addEventListener("click", ()=> setPiano(b.dataset.piano));
});
$("#searchInput").addEventListener("input", e=> renderHome(e.target.value));

function renderHome(filter){
  const f = (filter||"").trim().toLowerCase();
  homeEl.innerHTML = "";
  let any = false;
  GROUPS.forEach(g=>{
    const tunes = TUNES.filter(t=>t.group===g && (!f || t.title.toLowerCase().includes(f)));
    if(!tunes.length) return;
    any = true;
    const sec = document.createElement("section");
    const head = document.createElement("div");
    head.className = "sechead";
    head.innerHTML = "<h2></h2><div class='count'></div>";
    head.querySelector("h2").textContent = g.replace("Toddler rhymes - ","");
    head.querySelector(".count").textContent = tunes.length + (tunes.length===1?" tune":" tunes");
    sec.appendChild(head);
    const grid = document.createElement("div"); grid.className = "grid";
    tunes.forEach(t=>{
      const card = document.createElement("button");
      card.className = "card";
      const movie = t.group==="Movie themes";
      card.innerHTML =
        "<div class='tile"+(movie?" movie":"")+"'><div class='glyph"+(movie?"":" dim")+"'>"+t.glyph+"</div>"+
        "<div class='playbtn'>&#9654;</div></div>"+
        "<p class='cardtitle'></p><p class='cardsub'></p>";
      card.querySelector(".cardtitle").textContent = t.title;
      card.querySelector(".cardsub").textContent = firstNoteLabel(t) + " - " + PIANO_NAMES[piano];
      card.addEventListener("click", ()=> openTune(t.id));
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    homeEl.appendChild(sec);
  });
  if(!any){
    const d = document.createElement("div");
    d.className = "empty"; d.textContent = "No tunes match that search.";
    homeEl.appendChild(d);
  }
}
/* keyboard strip: whites from C. gig = 15 whites (C..C), casio window = 17 whites (C..E) with middle C at index 8 */
function buildKeyboard(v){
  const kb = $("#fKb"); kb.innerHTML = "";
  const whites = piano==="gig" ? 15 : 17;
  const letters = ["C","D","E","F","G","A","B"];
  const blackAfter = {C:1,D:1,F:1,G:1,A:1};
  for(let i=1;i<=whites;i++){
    const letter = letters[(i-1)%7];
    const w = document.createElement("div");
    w.className = "wkey" + (i===v.startKey ? " start" : "");
    if(piano==="casio" && i===8){ w.innerHTML = "<div class='lab'>C4</div>"; }
    kb.appendChild(w);
    if(blackAfter[letter] && i<whites){
      const b = document.createElement("div");
      b.className = "bkey";
      b.style.left = (i/whites*100) + "%";
      b.style.width = (100/whites*0.62) + "%";
      kb.appendChild(b);
    }
  }
  $("#kbLeft").textContent = piano==="gig" ? "Left C" : "C3";
  $("#kbMid").textContent = piano==="gig" ? "Middle C is the 8th white key" : "Middle C = C4";
  $("#kbRight").textContent = piano==="gig" ? "Top C" : "E5";
}
function openTune(id){
  currentId = id; follow = false; noteIdx = -1;
  renderFocus(true);
  focusEl.scrollTop = 0;
}
function renderFocus(scroll){
  const t = TUNES.find(x=>x.id===currentId);
  if(!t) return;
  const v = variant(t);
  focusEl.classList.add("open");
  document.body.style.overflow = "hidden";
  $("#fTitle").textContent = t.title;
  $("#fGroup").textContent = t.group + " - " + PIANO_NAMES[piano];
  $("#fName").textContent = t.title;
  $("#fStart").textContent = v.start;
  buildKeyboard(v);
  const notesEl = $("#fNotes"); notesEl.innerHTML = "";
  v.lines.forEach(line=>{
    const wrap = document.createElement("div"); wrap.className = "nline";
    const row = document.createElement("div"); row.className = "nrow";
    line[0].split(/\s+/).forEach(tok=>{
      if(!tok) return;
      const s = document.createElement("span");
      s.className = "tok" + ((tok==="|"||tok==="-") ? " sep" : "");
      s.textContent = tok;
      if(!(tok==="|"||tok==="-")) s.dataset.note = "1";
      row.appendChild(s);
    });
    wrap.appendChild(row);
    const ly = document.createElement("div"); ly.className = "lyric";
    ly.textContent = line[1]||"";
    wrap.appendChild(ly);
    notesEl.appendChild(wrap);
  });
  const tipEl = $("#fTip");
  if(t.tip){ tipEl.style.display="block"; tipEl.textContent = t.tip; }
  else tipEl.style.display = "none";
  const idx = TUNES.indexOf(t);
  $("#fProgress").textContent = (idx+1) + " of " + TUNES.length;
  updateFollowUI();
  if(scroll) focusEl.scrollTop = 0;
}
function noteSpans(){
  return Array.from(document.querySelectorAll("#fNotes .tok[data-note]"));
}
function updateFollowUI(){
  $("#followBtn").style.display = follow ? "none" : "";
  $("#nextNoteBtn").style.display = follow ? "" : "none";
  $("#resetBtn").style.display = follow ? "" : "none";
  if(follow) paintNotes();
}
function paintNotes(){
  const spans = noteSpans();
  spans.forEach((s,i)=>{
    s.classList.toggle("cur", i===noteIdx);
    s.classList.toggle("done", noteIdx>=0 && i<noteIdx);
  });
  const cur = spans[noteIdx];
  if(cur) cur.scrollIntoView({block:"nearest", behavior:"smooth"});
  $("#nextNoteBtn").textContent = noteIdx >= spans.length-1 ? "Done - tap to restart" : "Next note";
}
function stepNote(){
  const spans = noteSpans();
  if(noteIdx >= spans.length-1){ noteIdx = -1; }
  else noteIdx++;
  paintNotes();
}
$("#followBtn").addEventListener("click", ()=>{ follow = true; noteIdx = 0; updateFollowUI(); });
$("#nextNoteBtn").addEventListener("click", stepNote);
$("#resetBtn").addEventListener("click", ()=>{ follow = false; noteIdx = -1;
  noteSpans().forEach(s=>s.classList.remove("cur","done")); updateFollowUI(); });
$("#fNotes").addEventListener("click", ()=>{ if(follow) stepNote(); });
function closeFocus(){
  focusEl.classList.remove("open");
  document.body.style.overflow = "";
  currentId = null;
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; $("#wakeBtn").textContent = "Keep screen on"; }
}
$("#backBtn").addEventListener("click", closeFocus);
function stepTune(d){
  if(!currentId) return;
  const i = TUNES.findIndex(x=>x.id===currentId);
  const n = (i + d + TUNES.length) % TUNES.length;
  currentId = TUNES[n].id; follow = false; noteIdx = -1;
  renderFocus(true);
}
$("#prevTune").addEventListener("click", ()=>stepTune(-1));
$("#nextTune").addEventListener("click", ()=>stepTune(1));
$("#wakeBtn").addEventListener("click", async ()=>{
  if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock = null;
    $("#wakeBtn").textContent = "Keep screen on"; return; }
  try{
    wakeLock = await navigator.wakeLock.request("screen");
    $("#wakeBtn").textContent = "Screen stays on - tap to release";
    wakeLock.addEventListener("release", ()=>{ wakeLock = null; $("#wakeBtn").textContent = "Keep screen on"; });
  }catch(e){ $("#wakeBtn").textContent = "Screen lock not available here"; }
});
document.addEventListener("keydown", e=>{
  if(!currentId) return;
  if(e.key==="Escape") closeFocus();
  if(follow && (e.key===" " || e.key==="ArrowRight")){ e.preventDefault(); stepNote(); }
});
syncSegs();
renderHome("");
</script>
</body>
</html>
