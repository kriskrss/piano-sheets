<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Piano Sheets</title>
<style>
  :root{
    --canvas:#000000; --card:#121212; --elev:#1f1f1f; --hover:#292929;
    --iron:#333333; --steel:#535353; --fog:#73777c; --mist:#b3b3b3;
    --bone:#c5c5c5; --green:#1ed760; --white:#ffffff;
    --grad:linear-gradient(90deg,#af2896,#509bf5);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--canvas); color:var(--white);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.33; min-height:100vh;
  }
  /* ---------- top bar ---------- */
  header{
    position:sticky; top:0; z-index:20; background:var(--canvas);
    padding:10px 16px 8px; display:flex; flex-direction:column; gap:10px;
  }
  .brandrow{display:flex; align-items:center; gap:10px;}
  .logo{
    width:34px; height:34px; border-radius:500px; background:var(--green);
    color:#000; display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:700; flex:0 0 auto;
  }
  h1{font-size:24px; font-weight:700; line-height:1.2; margin:0;}
  .brandsub{color:var(--mist); font-size:12px; margin-left:auto; text-align:right;}
  /* piano switch: segmented pill */
  .seg{
    display:flex; background:var(--elev); border-radius:9999px; padding:3px; gap:3px;
  }
  .seg button{
    flex:1; border:0; background:transparent; color:var(--mist); cursor:pointer;
    font:inherit; font-weight:700; font-size:13px; padding:8px 10px; border-radius:9999px;
  }
  .seg button.active{background:var(--white); color:#000;}
  .seg.small button{font-size:12px; padding:6px 8px;}
  .search{
    display:flex; align-items:center; gap:8px; background:var(--elev);
    border-radius:500px; padding:9px 14px;
  }
  .search span{color:var(--bone); font-size:14px;}
  .search input{
    flex:1; background:transparent; border:0; outline:0; color:var(--white);
    font:inherit; font-size:14px; min-width:0;
  }
  .search input::placeholder{color:var(--bone);}
  /* ---------- sections & cards ---------- */
  main{padding:6px 16px 48px; max-width:1100px; margin:0 auto;}
  section{margin-top:26px;}
  .sechead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
  .sechead h2{font-size:24px; font-weight:700; line-height:1.2; margin:0;}
  .sechead .count{color:var(--mist); font-size:12px;}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  @media (min-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media (min-width:960px){ .grid{grid-template-columns:repeat(4,1fr);} }
  .card{
    background:var(--card); border-radius:6px; padding:12px; cursor:pointer;
    border:0; text-align:left; color:var(--white); font:inherit; width:100%;
  }
  .card:hover,.card:active{background:var(--hover);}
  .tile{
    position:relative; border-radius:6px; aspect-ratio:1/1; margin-bottom:10px;
    background:var(--elev); display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .tile.movie{background:var(--grad);}
  .tile .glyph{font-size:52px; font-weight:700; line-height:1; color:var(--white);}
  .tile .glyph.dim{color:var(--steel);}
  .playbtn{
    position:absolute; right:8px; bottom:8px; width:38px; height:38px;
    border-radius:500px; background:var(--green); color:#000; border:0;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    box-shadow:rgba(0,0,0,.5) 0 8px 24px 0;
  }
  .cardtitle{font-size:14px; font-weight:600; line-height:1.25; margin:0 0 2px;}
  .cardsub{color:var(--mist); font-size:12px; margin:0;}
  .empty{color:var(--mist); padding:24px 0; text-align:center;}
  /* ---------- focus view ---------- */
  #focus{
    position:fixed; inset:0; z-index:40; background:var(--canvas);
    overflow-y:auto; display:none; padding:0 16px 40px;
  }
  #focus.open{display:block;}
  .fbar{
    position:sticky; top:0; background:var(--canvas); z-index:5;
    display:flex; align-items:center; gap:10px; padding:10px 0 8px;
  }
  .roundbtn{
    width:36px; height:36px; border-radius:9999px; border:0; cursor:pointer;
    background:var(--elev); color:var(--white); font-size:17px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .fbar .ftitle{font-size:16px; font-weight:700; flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fbar .seg{flex:0 0 auto;}
  .fgroup{color:var(--green); font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:.08em; margin:8px 0 2px;}
  #focus h2{font-size:24px; font-weight:700; margin:0 0 6px; line-height:1.2;}
  .startbox{
    background:var(--card); border-radius:6px; padding:12px; color:var(--bone);
    font-size:13px; line-height:1.5; margin:12px 0 4px; white-space:pre-line;
  }
  /* keyboard strip */
  .kbwrap{margin:14px 0 4px;}
  .kb{position:relative; display:flex; height:74px; user-select:none;}
  .wkey{
    flex:1; background:var(--white); border:1px solid var(--iron);
    border-radius:0 0 4px 4px; position:relative;
  }
  .wkey.start{background:var(--green);}
  .wkey .lab{
    position:absolute; bottom:4px; left:0; right:0; text-align:center;
    font-size:10px; font-weight:700; color:#000;
  }
  .wkey.start .lab{color:#000;}
  .bkey{
    position:absolute; top:0; height:44px; background:#000;
    border:1px solid var(--iron); border-radius:0 0 3px 3px; z-index:2;
    transform:translateX(-50%);
  }
  .kbcaption{display:flex; justify-content:space-between; color:var(--fog);
    font-size:11px; margin-top:5px;}
  .kbcaption .midc{color:var(--green); font-weight:700;}
  /* notes */
  .notes{margin-top:16px;}
  .nline{margin:0 0 18px;}
  .nrow{line-height:1.35;}
  .tok{
    display:inline-block; font-weight:700; color:var(--white);
    font-size:clamp(24px,6.4vw,44px); margin:0 .18em 0 0; letter-spacing:.01em;
  }
  .tok.sep{color:var(--steel); font-weight:400;}
  .tok .dur{display:block; font-size:11px; font-weight:700; color:var(--fog); text-align:center; line-height:1;}
  .tok.hold .dur{color:var(--green);}
  .tok.quick .dur{color:var(--mist);}
  .tok.cur{background:var(--green); color:#000; border-radius:6px; padding:0 .12em;}
  .tok.cur .dur{color:#000;}
  .tok.done{color:var(--fog);}
  .tempo{display:flex; align-items:center; gap:8px; color:var(--mist); font-size:12px; font-weight:700;}
  .tempo input{accent-color:var(--green);}
  .rhythmhint{color:var(--fog); font-size:12px; margin-top:10px;}
  .lyric{color:var(--mist); font-size:13px; margin-top:2px; min-height:16px;}
  .tip{
    background:var(--card); border-radius:6px; padding:12px; color:var(--mist);
    font-size:13px; line-height:1.5; margin-top:6px; white-space:pre-line;
  }
  /* focus controls */
  .fcontrols{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px;}
  .pill{
    border-radius:9999px; border:0; cursor:pointer; font:inherit; font-weight:700;
    font-size:14px; padding:10px 18px; background:var(--white); color:#000;
  }
  .pill.green{background:var(--green);}
  .ghost{
    border-radius:9999px; border:0; cursor:pointer; font:inherit; font-weight:700;
    font-size:14px; padding:10px 16px; background:transparent; color:var(--mist);
  }
  .ghost:active,.ghost:hover{color:var(--white);}
  .navrow{display:flex; justify-content:space-between; margin-top:28px;
    border-top:1px solid var(--iron); padding-top:14px;}
  .progress{color:var(--fog); font-size:12px; align-self:center;}
  /* ---------- tablets: iPad Pro 11" (834x1194 / 1194x834) & Galaxy Tab S10 (10.9-12.4") ---------- */
  header{padding-top:calc(10px + env(safe-area-inset-top)); padding-left:calc(16px + env(safe-area-inset-left)); padding-right:calc(16px + env(safe-area-inset-right));}
  #focus{padding-left:calc(16px + env(safe-area-inset-left)); padding-right:calc(16px + env(safe-area-inset-right)); padding-bottom:calc(40px + env(safe-area-inset-bottom));}
  button,.seg button,.pill,.ghost,.card{touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
  .seg button,.pill,.ghost,.roundbtn{min-height:44px;}
  input{font-size:16px;} /* stops iPad auto-zoom on focus */
  @media (hover:none){ .card:hover{background:var(--card);} .ghost:hover{color:var(--mist);} }
  @media (min-width:700px){
    main{padding:8px 24px 64px; max-width:1180px;}
    header{padding-left:calc(24px + env(safe-area-inset-left)); padding-right:calc(24px + env(safe-area-inset-right));}
    .grid{gap:16px;}
    .card{padding:16px;}
    #focus{padding-left:calc(24px + env(safe-area-inset-left)); padding-right:calc(24px + env(safe-area-inset-right));}
    #focus>*{max-width:920px; margin-left:auto; margin-right:auto;}
    .kb{height:96px;}
    .bkey{height:56px;}
    h1{font-size:28px;}
    .sechead h2,#focus h2{font-size:28px;}
  }
  @media (min-width:700px) and (orientation:portrait){
    .grid{grid-template-columns:repeat(3,1fr);}
    .notes .tok{font-size:clamp(28px,4.5vw,44px);}
  }
  @media (min-width:1000px) and (orientation:landscape){
    .grid{grid-template-columns:repeat(4,1fr);}
    #focus>*{max-width:980px;}
    .kb{height:104px;}
    .fcontrols{flex-wrap:nowrap;}
  }
  @media (min-width:1400px){ .grid{grid-template-columns:repeat(5,1fr);} main{max-width:1280px;} }
  @media (max-width:699px){
    .fbar .ftitle{font-size:14px;}
    .fbar .seg.small button{padding:6px 6px; font-size:11px;}
    .tempo{width:100%;}
  }
</style>
</head>
<body>
<header>
  <div class="brandrow">
    <div class="logo">&#9834;</div>
    <h1>Piano Sheets</h1>
    <div class="brandsub">One finger tunes<br>for the piano</div>
  </div>
  <div class="seg" id="pianoSeg" role="tablist" aria-label="Choose your piano">
    <button data-piano="gig" class="active">Gigglescape</button>
    <button data-piano="casio">Casio CT-X700</button>
  </div>
  <label class="search"><span>&#128269;</span>
    <input id="searchInput" type="search" placeholder="Search tunes" autocomplete="off">
  </label>
</header>
<main id="home"></main>

<div id="focus" aria-live="polite">
  <div class="fbar">
    <button class="roundbtn" id="backBtn" aria-label="Back to all tunes">&#8592;</button>
    <div class="ftitle" id="fTitle"></div>
    <div class="seg small" id="pianoSegFocus">
      <button data-piano="gig">Gigglescape</button>
      <button data-piano="casio">Casio</button>
    </div>
  </div>
  <div class="fgroup" id="fGroup"></div>
  <h2 id="fName"></h2>
  <div class="startbox" id="fStart"></div>
  <div class="kbwrap">
    <div class="kb" id="fKb"></div>
    <div class="kbcaption"><span id="kbLeft"></span><span class="midc" id="kbMid"></span><span id="kbRight"></span></div>
  </div>
  <div class="notes" id="fNotes"></div>
  <div class="tip" id="fTip"></div>
  <div class="rhythmhint">Small number under each note = beats it lasts. &#189; is quick, 2&#8211;3 is a hold.</div>
  <div class="fcontrols">
    <button class="pill green" id="playBtn">&#9654; Play tune</button>
    <label class="tempo">Tempo <input id="tempoRange" type="range" min="50" max="160" step="2" value="100"><span id="tempoVal"></span></label>
    <button class="pill green" id="followBtn">Follow along</button>
    <button class="pill" id="nextNoteBtn" style="display:none">Next note</button>
    <button class="ghost" id="resetBtn" style="display:none">Start over</button>
    <button class="ghost" id="wakeBtn">Keep screen on</button>
  </div>
  <div class="navrow">
    <button class="ghost" id="prevTune">&#8592; Prev tune</button>
    <div class="progress" id="fProgress"></div>
    <button class="ghost" id="nextTune">Next tune &#8594;</button>
  </div>
</div>

<script>
"use strict";
/* ============ DATA ============
   Lines: [notes, lyric]. Notes are space separated tokens.
   Token suffix :beats is how long the note lasts (default 1), e.g. G:2 is a
   2-beat hold, C:0.5 is a quick half-beat. bpm is the tune's tempo.
   Gigglescape tokens may also carry @key (exact white key 1-15) when the
   letter alone spans octaves — Interstellar uses this; display strips it.
   gig  = Gigglescape toy piano, 15 white keys C..C, letters as printed.
          C+ = the next C up, G- = the G just below the start C of that tune.
   casio = Casio CT-X700, scientific names, middle C = C4.
*/
const GROUPS = ["Movie themes","Toddler rhymes - Set 1","Toddler rhymes - Set 2"];
const TUNES = [
{ id:"interstellar", title:"Interstellar - Main Theme", group:"Movie themes", glyph:"&#9834;", bpm:72,
  tip:"The whole piece is this one pattern repeating and getting bigger. Play it a second time through a little stronger.",
  gig:{ startKey:4, start:"Work in the middle of the piano.\nPlay the low note once, then its pattern. Slow and steady, one note per beat.\nThe note you keep coming back to is E, the 10th white key.",
    lines:[["F:2@4 | A:0.5@6 E:0.5@10 A:0.5@6 E:0.5@10",""],["G:2@5 | B:0.5@7 E:0.5@10 B:0.5@7 E:0.5@10",""],["A:2@6 | C:0.5@8 E:0.5@10 C:0.5@8 E:0.5@10",""],["G:2@5 | D:0.5@9 E:0.5@10 D:0.5@9 E:0.5@10",""],["F@11 G@12 A@13 G:3@12","the turn, above the E"]] },
  casio:{ startKey:4, start:"The low notes are F3, G3 and A3, below middle C (C4).\nThe note you keep coming back to is E5. The pattern notes climb A4, B4, C5, D5 under it.\nPlay the low note once, then its pattern. Slow and steady.",
    lines:[["F3:2 | A4:0.5 E5:0.5 A4:0.5 E5:0.5",""],["G3:2 | B4:0.5 E5:0.5 B4:0.5 E5:0.5",""],["A3:2 | C5:0.5 E5:0.5 C5:0.5 E5:0.5",""],["G3:2 | D5:0.5 E5:0.5 D5:0.5 E5:0.5",""],["F5 G5 A5 G5:3","the turn"]] } },
{ id:"hedwig", title:"Harry Potter - Hedwig's Theme", group:"Movie themes", glyph:"&#9834;", bpm:96,
  tip:"This is the famous opening, simplified to one finger. Sharps (#) are black keys: the black key just after the letter key.\nPlay it slowly. The tune sounds best unhurried.",
  gig:{ startKey:3, start:"Start on the first E, the 3rd white key.\nC+ is the middle C (8th white key). Notes with + are in the higher half.\nD# is the black key just before the second E. F# is the black key just before the higher G.",
    lines:[["E:2@3 A@6 C+@8 B@7 A:2@6","the famous opening"],["E+:1.5@10 D#:0.5@9 B+@14 A+:2@13",""],["B:2@7 E+@10 G+@12 F#@11 E+:2@10",""],["B+:1.5@14 A+:0.5@13 F#:3@11",""],["E+@10 G+@12 F#:0.5@11 D+:0.5@9 F+@11 B:3@7",""]] },
  casio:{ startKey:7, start:"Start on B3, the B just below middle C (C4).\nSharps (#) are black keys: the black key just after the letter key.\nThis is the fuller version. The Casio has the range for all of it.",
    lines:[["B3:1.5 E4 G4 F#4:0.5 E4:2 B4 A4 F#4:2",""],["E4:1.5 G4 F#4 D4:0.5 F4 B3:3",""],["B3:1.5 E4 G4 F#4:0.5 E4:2 B4 D5 C#5:0.5 C5:0.5",""],["G#4 C5 B4 A#4:3",""],["G4 E4 E4:2 B4 G4 B4 G4 C5",""],["B4 A#4 F#4 G4:2 B4:0.5 A#4:0.5 A#3:2",""],["C4 B3 G4 G4 B4 G4 B4 G4 D5:2",""],["C#5:0.5 C5:0.5 G#4 C5 B4 A#4 E4 E4:3",""]] } },
{ id:"twinkle", title:"Twinkle, Twinkle, Little Star", group:"Toddler rhymes - Set 1", glyph:"T", bpm:100,
  tip:"The ABC song and Baa, Baa, Black Sheep use this same tune.",
  gig:{ startKey:1, start:"Start on the left C, the very first white key.",
    lines:[["C C G G A A G:2","Twin-kle, twin-kle, lit-tle star"],["F F E E D D C:2","How I won-der what you are"],["G G F F E E D:2","Up a-bove the world so high"],["G G F F E E D:2","Like a dia-mond in the sky"],["C C G G A A G:2","Twin-kle, twin-kle, lit-tle star"],["F F E E D D C:2","How I won-der what you are"]] },
  casio:{ startKey:8, start:"Start on middle C (C4). All of this tune sits in the C4 to A4 range.",
    lines:[["C4 C4 G4 G4 A4 A4 G4:2","Twin-kle, twin-kle, lit-tle star"],["F4 F4 E4 E4 D4 D4 C4:2","How I won-der what you are"],["G4 G4 F4 F4 E4 E4 D4:2","Up a-bove the world so high"],["G4 G4 F4 F4 E4 E4 D4:2","Like a dia-mond in the sky"],["C4 C4 G4 G4 A4 A4 G4:2","Twin-kle, twin-kle, lit-tle star"],["F4 F4 E4 E4 D4 D4 C4:2","How I won-der what you are"]] } },
{ id:"mary", title:"Mary Had a Little Lamb", group:"Toddler rhymes - Set 1", glyph:"M", bpm:112,
  tip:"Hold the last C a little longer.",
  gig:{ startKey:3, start:"Start on the left C. The first note is E, the 3rd white key.",
    lines:[["E D C D","Ma-ry had a"],["E E E:2","lit-tle lamb"],["D D D:2","lit-tle lamb"],["E G G:2","lit-tle lamb"],["E D C D","Ma-ry had a"],["E E E E","lit-tle lamb, lit-tle"],["D D E D","lamb, Ma-ry"],["C:3","had a lit-tle lamb (hold)"]] },
  casio:{ startKey:10, start:"Start around middle C (C4). The first note is E4.",
    lines:[["E4 D4 C4 D4","Ma-ry had a"],["E4 E4 E4:2","lit-tle lamb"],["D4 D4 D4:2","lit-tle lamb"],["E4 G4 G4:2","lit-tle lamb"],["E4 D4 C4 D4","Ma-ry had a"],["E4 E4 E4 E4","lit-tle lamb, lit-tle"],["D4 D4 E4 D4","lamb, Ma-ry"],["C4:3","had a lit-tle lamb (hold)"]] } },
{ id:"hotcross", title:"Hot Cross Buns", group:"Toddler rhymes - Set 1", glyph:"H", bpm:120,
  tip:"Only three notes in the whole song: E, D and C.",
  gig:{ startKey:3, start:"Start on the left C. The first note is E, the 3rd white key.",
    lines:[["E D C:2","Hot cross buns"],["E D C:2","Hot cross buns"],["C:0.5 C:0.5 C:0.5 C:0.5 D:0.5 D:0.5 D:0.5 D:0.5","One a pen-ny, two a pen-ny"],["E D C:2","Hot cross buns"]] },
  casio:{ startKey:10, start:"Start around middle C (C4). The first note is E4.",
    lines:[["E4 D4 C4:2","Hot cross buns"],["E4 D4 C4:2","Hot cross buns"],["C4:0.5 C4:0.5 C4:0.5 C4:0.5 D4:0.5 D4:0.5 D4:0.5 D4:0.5","One a pen-ny, two a pen-ny"],["E4 D4 C4:2","Hot cross buns"]] } },
{ id:"oldmac", title:"Old MacDonald Had a Farm", group:"Toddler rhymes - Set 1", glyph:"O", bpm:112,
  tip:"These are the main two lines. Repeat them for every animal.",
  gig:{ startKey:1, start:"Start on the left C, the very first white key.",
    lines:[["C C C G A A G:2","Old Mac-Don-ald had a farm"],["E E D D C:2","Ee i ee i o"]] },
  casio:{ startKey:8, start:"Start on middle C (C4).",
    lines:[["C4 C4 C4 G4 A4 A4 G4:2","Old Mac-Don-ald had a farm"],["E4 E4 D4 D4 C4:2","Ee i ee i o"]] } },
{ id:"londonbridge", title:"London Bridge Is Falling Down", group:"Toddler rhymes - Set 1", glyph:"L", bpm:112,
  tip:"",
  gig:{ startKey:5, start:"Start on the left C. The first note is G, the 5th white key.",
    lines:[["G:1.5 A:0.5 G F E F G:2","Lon-don Bridge is fall-ing down"],["D E F:2 E F G:2","fall-ing down, fall-ing down"],["G:1.5 A:0.5 G F E F G:2","Lon-don Bridge is fall-ing down"],["D:2 G:2 E C:2","my fair la-dy"]] },
  casio:{ startKey:12, start:"Start around middle C (C4). The first note is G4.",
    lines:[["G4:1.5 A4:0.5 G4 F4 E4 F4 G4:2","Lon-don Bridge is fall-ing down"],["D4 E4 F4:2 E4 F4 G4:2","fall-ing down, fall-ing down"],["G4:1.5 A4:0.5 G4 F4 E4 F4 G4:2","Lon-don Bridge is fall-ing down"],["D4:2 G4:2 E4 C4:2","my fair la-dy"]] } },
{ id:"rowboat", title:"Row, Row, Row Your Boat", group:"Toddler rhymes - Set 1", glyph:"R", bpm:120,
  tip:"C+ is the middle C, the 8th white key.",
  gig:{ startKey:1, start:"Start on the left C, the very first white key.\nC+ is the middle C, the 8th white key.",

/* ============ STATE ============ */
const PIANO_NAMES = { gig:"Gigglescape toy piano", casio:"Casio CT-X700" };
let piano = localStorage.getItem("pianoSheetsPiano") || "gig";
if(!PIANO_NAMES[piano]) piano = "gig";
let currentId = null, follow = false, noteIdx = -1, wakeLock = null;
let audioCtx = null, masterGain = null, playbackTimers = [], playing = false, currentSeq = [];

/* ============ RHYTHM + PITCH ============ */
function tokenBeats(tok){
  const m = String(tok).match(/:(\d+(?:\.\d+)?)(?:@\d+)?$/);
  return m ? parseFloat(m[1]) : 1;
}
function tokenPitch(tok){ return String(tok).replace(/(:\d+(?:\.\d+)?)?(@\d+)?$/, ""); }
/* Gigglescape only: @N pins the exact white key (1-15) when a tune spans
   octaves and the letter alone is ambiguous, e.g. Interstellar's E @10. */
function tokenKey(tok){
  const m = String(tok).match(/@(\d+)$/);
  return m ? parseInt(m[1],10) : null;
}
function beatsLabel(b){ return b===0.5 ? "\u00bd" : b===1.5 ? "1\u00bd" : String(b); }
const SEMI = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function casioMidi(p){
  const m = p.match(/^([A-G])(#|b)?(\d)$/);
  if(!m) return 60;
  return (parseInt(m[3],10)+1)*12 + SEMI[m[1]] + (m[2]==="#"?1:m[2]==="b"?-1:0);
}
function gigCandidates(){
  const out = [], letters = ["C","D","E","F","G","A","B"];
  for(let i=1;i<=15;i++){
    const midi = 60 + Math.floor((i-1)/7)*12 + SEMI[letters[(i-1)%7]];
    out.push({letter:letters[(i-1)%7], sharp:false, midi});
    if([0,1,3,4,5].includes((i-1)%7) && i<15) out.push({letter:letters[(i-1)%7], sharp:true, midi:midi+1});
  }
  return out;
}
/* Flatten a variant into [{pitch,beats,midi}] in display order. */
function buildSequence(v){
  const seq = [];
  const cands = gigCandidates();
  let prev = null;
  v.lines.forEach(line=>{
    line[0].split(/\s+/).forEach(tok=>{
      if(!tok || tok==="|" || tok==="-") return;
      const pitch = tokenPitch(tok), beats = tokenBeats(tok);
      let midi;
      if(piano==="casio"){ midi = casioMidi(pitch); }
      else if(tokenKey(tok) !== null){
        const k = tokenKey(tok);
        midi = 60 + Math.floor((k-1)/7)*12 + SEMI[["C","D","E","F","G","A","B"][(k-1)%7]] + (pitch.includes("#") ? 1 : 0);
      }
      else {
        const m = pitch.match(/^([A-G])(#)?([+-])?$/);
        const letter = m ? m[1] : "C", sharp = !!(m && m[2]), suf = m ? m[3] : null;
        let pool = cands.filter(c=>c.letter===letter && c.sharp===sharp);
        if(suf==="+") pool = pool.filter(c=>c.midi>=72);
        if(suf==="-") pool = pool.filter(c=>c.midi<72);
        if(!pool.length) pool = cands.filter(c=>c.letter===letter);
        if(prev===null){
          const startMidi = 60 + Math.floor((v.startKey-1)/7)*12 + SEMI[["C","D","E","F","G","A","B"][(v.startKey-1)%7]] + (sharp?1:0);
          midi = pool.reduce((a,b)=> Math.abs(b.midi-startMidi)<Math.abs(a.midi-startMidi)?b:a, pool[0]).midi;
        } else {
          midi = pool.reduce((a,b)=> Math.abs(b.midi-prev)<Math.abs(a.midi-prev)?b:a, pool[0]).midi;
        }
      }
      seq.push({pitch, beats, midi}); prev = midi;
    });
  });
  return seq;
}
function ensureAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    audioCtx = new AC(); masterGain = audioCtx.createGain(); masterGain.gain.value = 0.5;
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state==="suspended") audioCtx.resume();
  return true;
}
function playToneAt(midi, when, durSec){
  const freq = 440 * Math.pow(2, (midi-69)/12);
  const osc = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = "triangle"; osc.frequency.value = freq;
  osc2.type = "sine"; osc2.frequency.value = freq*2;
  const g2 = audioCtx.createGain(); g2.gain.value = 0.25;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.9, when+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, when + Math.max(0.12, durSec));
  osc.connect(g); osc2.connect(g2); g2.connect(g); g.connect(masterGain);
  osc.start(when); osc2.start(when); osc.stop(when+durSec+0.05); osc2.stop(when+durSec+0.05);
}
function tempoBpm(){ return parseInt($("#tempoRange").value,10) || 100; }
function stopPlayback(){
  playbackTimers.forEach(clearTimeout); playbackTimers = [];
  if(masterGain && audioCtx){ try{ masterGain.disconnect(); }catch(e){} masterGain = audioCtx.createGain(); masterGain.gain.value = 0.5; masterGain.connect(audioCtx.destination); }
  playing = false;
  const b = $("#playBtn"); if(b) b.innerHTML = "&#9654; Play tune";
}
function playTune(){
  if(playing){ stopPlayback(); return; }
  if(!currentSeq.length || !ensureAudio()) return;
  follow = false; updateFollowUI();
  playing = true; $("#playBtn").textContent = "Stop";
  const beatSec = 60 / tempoBpm(), t0 = audioCtx.currentTime + 0.08;
  let offset = 0;
  currentSeq.forEach((n,i)=>{
    playToneAt(n.midi, t0 + offset, Math.max(0.12, n.beats*beatSec*0.92));
    const at = offset;
    playbackTimers.push(setTimeout(()=>{ noteIdx = i; paintNotes(); }, at*1000));
    offset += n.beats * beatSec;
  });
  playbackTimers.push(setTimeout(()=>{ stopPlayback(); noteIdx = -1; noteSpans().forEach(s=>s.classList.remove("cur","done")); }, offset*1000 + 60));
}

const $ = s => document.querySelector(s);
const homeEl = $("#home"), focusEl = $("#focus");

function variant(t){ return t[piano]; }
function firstNoteLabel(t){
  const v = variant(t);
  const toks = v.lines[0][0].split(/\s+/).filter(x=>x && x!=="|" && x!=="-");
  return "Starts on " + tokenPitch(toks[0]||"");
}
function syncSegs(){
  document.querySelectorAll("#pianoSeg button, #pianoSegFocus button").forEach(b=>{
    b.classList.toggle("active", b.dataset.piano===piano);
  });
}
function setPiano(p){
  stopPlayback();
  piano = p; localStorage.setItem("pianoSheetsPiano", p);
  syncSegs(); renderHome($("#searchInput").value||"");
  if(currentId) renderFocus(false);
}
document.querySelectorAll("#pianoSeg button, #pianoSegFocus button").forEach(b=>{
  b.addEventListener("click", ()=> setPiano(b.dataset.piano));
});
$("#searchInput").addEventListener("input", e=> renderHome(e.target.value));

function renderHome(filter){
  const f = (filter||"").trim().toLowerCase();
  homeEl.innerHTML = "";
  let any = false;
  GROUPS.forEach(g=>{
    const tunes = TUNES.filter(t=>t.group===g && (!f || t.title.toLowerCase().includes(f)));
    if(!tunes.length) return;
    any = true;
    const sec = document.createElement("section");
    const head = document.createElement("div");
    head.className = "sechead";
    head.innerHTML = "<h2></h2><div class='count'></div>";
    head.querySelector("h2").textContent = g.replace("Toddler rhymes - ","");
    head.querySelector(".count").textContent = tunes.length + (tunes.length===1?" tune":" tunes");
    sec.appendChild(head);
    const grid = document.createElement("div"); grid.className = "grid";
    tunes.forEach(t=>{
      const card = document.createElement("button");
      card.className = "card";
      const movie = t.group==="Movie themes";
      card.innerHTML =
        "<div class='tile"+(movie?" movie":"")+"'><div class='glyph"+(movie?"":" dim")+"'>"+t.glyph+"</div>"+
        "<div class='playbtn'>&#9654;</div></div>"+
        "<p class='cardtitle'></p><p class='cardsub'></p>";
      card.querySelector(".cardtitle").textContent = t.title;
      card.querySelector(".cardsub").textContent = firstNoteLabel(t) + " - " + PIANO_NAMES[piano];
      card.addEventListener("click", ()=> openTune(t.id));
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    homeEl.appendChild(sec);
  });
  if(!any){
    const d = document.createElement("div");
    d.className = "empty"; d.textContent = "No tunes match that search.";
    homeEl.appendChild(d);
  }
}
/* keyboard strip: whites from C. gig = 15 whites (C..C), casio window = 17 whites (C..E) with middle C at index 8 */
function buildKeyboard(v){
  const kb = $("#fKb"); kb.innerHTML = "";
  const whites = piano==="gig" ? 15 : 17;
  const letters = ["C","D","E","F","G","A","B"];
  const blackAfter = {C:1,D:1,F:1,G:1,A:1};
  for(let i=1;i<=whites;i++){
    const letter = letters[(i-1)%7];
    const w = document.createElement("div");
    w.className = "wkey" + (i===v.startKey ? " start" : "");
    if(piano==="casio" && i===8){ w.innerHTML = "<div class='lab'>C4</div>"; }
    kb.appendChild(w);
    if(blackAfter[letter] && i<whites){
      const b = document.createElement("div");
      b.className = "bkey";
      b.style.left = (i/whites*100) + "%";
      b.style.width = (100/whites*0.62) + "%";
      kb.appendChild(b);
    }
  }
  $("#kbLeft").textContent = piano==="gig" ? "Left C" : "C3";
  $("#kbMid").textContent = piano==="gig" ? "Middle C is the 8th white key" : "Middle C = C4";
  $("#kbRight").textContent = piano==="gig" ? "Top C" : "E5";
}
function openTune(id){
  stopPlayback();
  currentId = id; follow = false; noteIdx = -1;
  renderFocus(true);
  focusEl.scrollTop = 0;
}
function renderFocus(scroll){
  const t = TUNES.find(x=>x.id===currentId);
  if(!t) return;
  const v = variant(t);
  focusEl.classList.add("open");
  document.body.style.overflow = "hidden";
  $("#fTitle").textContent = t.title;
  $("#fGroup").textContent = t.group + " - " + PIANO_NAMES[piano];
  $("#fName").textContent = t.title;
  $("#fStart").textContent = v.start;
  buildKeyboard(v);
  const notesEl = $("#fNotes"); notesEl.innerHTML = "";
  v.lines.forEach(line=>{
    const wrap = document.createElement("div"); wrap.className = "nline";
    const row = document.createElement("div"); row.className = "nrow";
    line[0].split(/\s+/).forEach(tok=>{
      if(!tok) return;
      const s = document.createElement("span");
      const isSep = (tok==="|"||tok==="-");
      const beats = isSep ? 0 : tokenBeats(tok);
      s.className = "tok" + (isSep ? " sep" : beats>1 ? " hold" : beats<1 ? " quick" : "");
      if(isSep){ s.textContent = tok; }
      else {
        s.dataset.note = "1"; s.dataset.beats = beats;
        const pitchEl = document.createElement("span"); pitchEl.textContent = tokenPitch(tok); s.appendChild(pitchEl);
        const dur = document.createElement("span"); dur.className = "dur"; dur.textContent = beatsLabel(beats); s.appendChild(dur);
      }
      row.appendChild(s);
    });
    wrap.appendChild(row);
    const ly = document.createElement("div"); ly.className = "lyric";
    ly.textContent = line[1]||"";
    wrap.appendChild(ly);
    notesEl.appendChild(wrap);
  });
  const tipEl = $("#fTip");
  if(t.tip){ tipEl.style.display="block"; tipEl.textContent = t.tip; }
  else tipEl.style.display = "none";
  const idx = TUNES.indexOf(t);
  $("#fProgress").textContent = (idx+1) + " of " + TUNES.length;
  currentSeq = buildSequence(v);
  const tempoEl = $("#tempoRange"); tempoEl.value = t.bpm || 100;
  $("#tempoVal").textContent = (t.bpm || 100) + " bpm";
  updateFollowUI();
  if(scroll) focusEl.scrollTop = 0;
}
function noteSpans(){
  return Array.from(document.querySelectorAll("#fNotes .tok[data-note]"));
}
function updateFollowUI(){
  $("#followBtn").style.display = follow ? "none" : "";
  $("#nextNoteBtn").style.display = follow ? "" : "none";
  $("#resetBtn").style.display = follow ? "" : "none";
  if(follow) paintNotes();
}
function paintNotes(){
  const spans = noteSpans();
  spans.forEach((s,i)=>{
    s.classList.toggle("cur", i===noteIdx);
    s.classList.toggle("done", noteIdx>=0 && i<noteIdx);
  });
  const cur = spans[noteIdx];
  if(cur) cur.scrollIntoView({block:"nearest", behavior:"smooth"});
  $("#nextNoteBtn").textContent = noteIdx >= spans.length-1 ? "Done - tap to restart" : "Next note";
}
function stepNote(){
  const spans = noteSpans();
  if(noteIdx >= spans.length-1){ noteIdx = -1; }
  else noteIdx++;
  paintNotes();
  /* Tutorial cadence: sound the note for its full beat length, so a hold
     is heard as a hold and a half-beat as quick. */
  const n = currentSeq[noteIdx];
  if(follow && n && ensureAudio()) playToneAt(n.midi, audioCtx.currentTime + 0.02, Math.max(0.12, n.beats * (60/tempoBpm()) * 0.92));
}
$("#playBtn").addEventListener("click", playTune);
$("#tempoRange").addEventListener("input", e=>{ $("#tempoVal").textContent = e.target.value + " bpm"; if(playing) stopPlayback(); });
$("#followBtn").addEventListener("click", ()=>{ stopPlayback(); follow = true; noteIdx = 0; updateFollowUI(); const n = currentSeq[0]; if(n && ensureAudio()) playToneAt(n.midi, audioCtx.currentTime + 0.02, Math.max(0.12, n.beats * (60/tempoBpm()) * 0.92)); });
$("#nextNoteBtn").addEventListener("click", stepNote);
$("#resetBtn").addEventListener("click", ()=>{ follow = false; noteIdx = -1;
  noteSpans().forEach(s=>s.classList.remove("cur","done")); updateFollowUI(); });
$("#fNotes").addEventListener("click", ()=>{ if(follow) stepNote(); });
function closeFocus(){
  stopPlayback();
  focusEl.classList.remove("open");
  document.body.style.overflow = "";
  currentId = null;
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; $("#wakeBtn").textContent = "Keep screen on"; }
}
$("#backBtn").addEventListener("click", closeFocus);
function stepTune(d){
  if(!currentId) return;
  const i = TUNES.findIndex(x=>x.id===currentId);
  const n = (i + d + TUNES.length) % TUNES.length;
  currentId = TUNES[n].id; follow = false; noteIdx = -1;
  renderFocus(true);
}
$("#prevTune").addEventListener("click", ()=>stepTune(-1));
$("#nextTune").addEventListener("click", ()=>stepTune(1));
$("#wakeBtn").addEventListener("click", async ()=>{
  if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock = null;
    $("#wakeBtn").textContent = "Keep screen on"; return; }
  try{
    wakeLock = await navigator.wakeLock.request("screen");
    $("#wakeBtn").textContent = "Screen stays on - tap to release";
    wakeLock.addEventListener("release", ()=>{ wakeLock = null; $("#wakeBtn").textContent = "Keep screen on"; });
  }catch(e){ $("#wakeBtn").textContent = "Screen lock not available here"; }
});
document.addEventListener("keydown", e=>{
  if(!currentId) return;
  if(e.key==="Escape") closeFocus();
  if(follow && (e.key===" " || e.key==="ArrowRight")){ e.preventDefault(); stepNote(); }
});
syncSegs();
renderHome("");
</script>
</body>
</html>
